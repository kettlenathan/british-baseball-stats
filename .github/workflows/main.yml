
# .github/workflows/refresh-data.yml
#
# MANUAL-ONLY. The weekly refresh now runs locally via Windows Task Scheduler
# (scripts/weekly_refresh.ps1, installed by scripts/install_scheduled_task.ps1)
# — see CLAUDE.md's "Data refresh cadence" section.
#
# The `schedule:` cron that used to live here was removed because
# stats.britishbaseball.org.uk's CloudFront/WAF returns 403 to GitHub's
# hosted-runner IP ranges. It worked until 2026-07-12 and has been blocked on
# every attempt since 2026-07-19 (including three separate runners an hour
# apart, which rules out an unlucky runner IP), while the identical request
# with the identical headers from a home connection returns 200. Every run
# died on the very first schedule fetch, seconds in — nothing here is
# retryable around a block at the network edge.
#
# Kept dispatchable rather than deleted: if the block ever lifts, a manual run
# is the cheapest way to find out, and it's still the right place to do a
# full-season backfill from a clean checkout.

name: Refresh Data

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      # Must run before alembic: a fresh checkout has no local data/stats.db
      # at all, and SQLite auto-creates an empty file the moment anything
      # connects to that path — including alembic itself. Fetching the real
      # published snapshot first means alembic upgrades *that*, not a blank
      # database that would otherwise get published over the real data.
      - name: Fetch latest published data
        run: uv run python -m scripts.pull_latest_db

      - name: Apply pending migrations
        run: uv run alembic upgrade head

      - name: Refresh data
        run: |
          uv run python -m scripts.refresh_data \
            --leagues nbl,d2,d3,d4,d5 \
            --years 2026 \
            --last-month

      # Runs only if every step above succeeded — scripts.refresh_data exits
      # non-zero when *all* schedule scrapes fail, which fails the job here
      # rather than silently republishing an unchanged database.
      - name: Publish data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m scripts.publish_db
